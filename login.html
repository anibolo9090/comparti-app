<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Compartí</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --primary: #2563eb; 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 40px; }

    .navbar { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .navbar-inner { max-width: 500px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: #60a5fa; text-decoration: none; }

    .card { max-width: 450px; margin: 40px auto; background: var(--card-bg); padding: 28px; border-radius: 16px; border: 1px solid var(--card-border); }
    h1 { font-size: 1.5rem; margin-top: 0; margin-bottom: 20px; text-align: center; background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #cbd5e1; }
    input { width: 100%; padding: 12px 14px; border: 1px solid var(--card-border); border-radius: 10px; font-size: 1rem; outline: none; background: rgba(15, 23, 42, 0.7); color: #fff; transition: all 0.2s; }
    input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25); }
    
    .btn-submit { width: 100%; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .btn-submit:hover { opacity: 0.9; }

    .footer-text { margin-top: 20px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
    .footer-text a { color: #60a5fa; text-decoration: none; font-weight: 600; }

    #status { margin-top: 16px; text-align: center; font-weight: 600; font-size: 0.9rem; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">🤝 Compartí</a>
    </div>
  </nav>

  <div class="card">
    <h1>🔑 Iniciar Sesión</h1>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <div id="status"></div>

    <div class="footer-text">
      ¿No tenés una cuenta? <a href="registro.html">Registrate acá</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xygatgvzdniivzwndaxy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5Z2F0Z3Z6ZG5paXZ6d25kYXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDU1MTcsImV4cCI6MjEwMjk4MTUxN30.oSoJcTxCw69F0AXmVVw5LFeF0HjdCSwHd_yOH4HwbS8';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      status.className = '';
      status.innerText = 'Iniciando sesión...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await db.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        status.className = 'error';
        status.innerText = 'Error: ' + error.message;
      } else {
        status.className = 'success';
        status.innerText = '¡Sesión iniciada correctamente!';
        setTimeout(() => { window.location.href = 'publicar.html'; }, 1000);
      }
    });
  </script>
</body>
</html>
