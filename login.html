<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Compartí</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --primary: #2563eb; 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; }

    .card { width: 100%; max-width: 400px; background: var(--card-bg); padding: 32px; border-radius: 20px; border: 1px solid var(--card-border); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin: 16px; }
    h1 { font-size: 1.6rem; margin-top: 0; margin-bottom: 10px; background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

    .btn-google { width: 100%; background: #ffffff; color: #1e293b; border: 1px solid var(--card-border); padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; }
    .btn-google:hover { background: #f1f5f9; }

    #status { margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🤝 Compartí</h1>
    <p>Iniciá sesión con tu cuenta de Google para continuar</p>
    
    <button onclick="iniciarSesionGoogle()" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.15v3.14C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.15C.42 8.1 0 9.77 0 11.5s.42 3.4 1.15 4.88l4.12-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.15 6.62l4.12 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Continuar con Google
    </button>

    <div id="status"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xygatgvzdniivzwndaxy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5Z2F0Z3Z6ZG5paXZ6d25kYXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDU1MTcsImV4cCI6MjEwMjk4MTUxN30.oSoJcTxCw69F0AXmVVw5LFeF0HjdCSwHd_yOH4HwbS8';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function iniciarSesionGoogle() {
      const status = document.getElementById('status');
      status.className = '';
      status.innerText = 'Redirigiendo a Google...';

      try {
        const { data, error } = await db.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/mis-ofertas.html'
          }
        });

        if (error) {
          status.className = 'error';
          status.innerText = 'Error: ' + error.message;
        }
      } catch (err) {
        status.className = 'error';
        status.innerText = 'Error de conexión con Google.';
      }
    }
  </script>
</body>
</html>
