<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar Ofertas — Compartí</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --primary: #3b82f6; 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 40px; }
    
    .navbar { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .navbar-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: #60a5fa; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .btn-nav { background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.85rem; font-weight: 700; border: 1px solid rgba(96, 165, 250, 0.3); }

    .main-container { max-width: 800px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin-bottom: 18px; background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .search-box { position: relative; margin-bottom: 24px; }
    .search-input { width: 100%; padding: 14px 16px; border: 1px solid var(--card-border); border-radius: 12px; font-size: 1rem; background: var(--card-bg); color: var(--text); outline: none; transition: all 0.2s; }
    .search-input::placeholder { color: #64748b; }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--card-border); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .service-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.1rem; color: #fff; }
    
    .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .status-permitida { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .status-condicionada { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }

    .price-tag { font-size: 1.7rem; font-weight: 800; color: #fff; margin: 8px 0; }
    .price-tag small { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }

    .details-box { background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 10px; font-size: 0.85rem; color: #cbd5e1; margin: 12px 0 16px; line-height: 1.4; border: 1px solid rgba(255,255,255,0.05); }

    .btn-ws { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: #fff; text-decoration: none; font-weight: 700; padding: 12px; border-radius: 10px; transition: opacity 0.2s; }
    .btn-ws:hover { opacity: 0.9; }

    #status { text-align: center; color: var(--text-muted); font-weight: 600; margin-top: 40px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">🤝 Compartí</a>
      <a href="publicar.html" class="btn-nav">+ Publicar</a>
    </div>
  </nav>

  <div class="main-container">
    <h1>Todas las Ofertas Disponibles</h1>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar (NBA, ChatGPT, Spotify, Netflix, Crunchyroll)...">
    </div>

    <div id="status">Cargando ofertas activas...</div>
    <div class="grid" id="offers-grid"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xygatgvzdniivzwndaxy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5Z2F0Z3Z6ZG5paXZ6d25kYXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDU1MTcsImV4cCI6MjEwMjk4MTUxN30.oSoJcTxCw69F0AXmVVw5LFeF0HjdCSwHd_yOH4HwbS8';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let todasLasOfertas = [];

    async function cargarOfertas() {
      const statusEl = document.getElementById('status');

      const { data: offers, error } = await db
        .from('offers')
        .select('*, plans(name, compatibility_status, services(name, icon, color))');

      if (error) {
        statusEl.innerText = 'Error al cargar ofertas.';
        return;
      }

      if (!offers || offers.length === 0) {
        statusEl.innerText = 'No hay ofertas publicadas aún.';
        return;
      }

      todasLasOfertas = offers;
      renderizarOfertas(offers);
    }

    function renderizarOfertas(lista) {
      const gridEl = document.getElementById('offers-grid');
      const statusEl = document.getElementById('status');
      gridEl.innerHTML = '';

      if (lista.length === 0) {
        statusEl.style.display = 'block';
        statusEl.innerText = 'No se encontraron ofertas para esa búsqueda.';
        return;
      } else {
        statusEl.style.display = 'none';
      }

      lista.forEach(offer => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const planName = offer.plans ? offer.plans.name : 'Servicio general';
        const icon = (offer.plans && offer.plans.services) ? offer.plans.services.icon : '📺';
        const status = offer.plans ? offer.plans.compatibility_status : 'permitida';
        const statusText = status === 'permitida' ? '🟢 Permitida' : '🟡 Condicionada';
        
        const phone = offer.whatsapp_number || '5491112345678';
        const mensajeWS = encodeURIComponent(`¡Hola! Vi tu oferta de ${planName} ($${offer.price_per_slot}/mes) en Compartí y me interesa ocupar un cupo.`);
        const urlWhatsApp = `https://wa.me/${phone}?text=${mensajeWS}`;

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="service-badge">
                <span>${icon}</span> ${planName}
              </div>
              <span class="status-pill status-${status}">${statusText}</span>
            </div>

            <div class="price-tag">
              $${offer.price_per_slot.toLocaleString('es-AR')} <small>/ mes</small>
            </div>

            <div class="details-box">
              📍 Cupos libres: <strong>${offer.available_slots}</strong><br>
              💬 ${offer.description || 'Sin detalles adicionales'}
            </div>
          </div>

          <a href="${urlWhatsApp}" target="_blank" class="btn-ws">
            <span>💬</span> Contactar por WhatsApp
          </a>
        `;
        gridEl.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const busqueda = e.target.value.toLowerCase().trim();
      const filtradas = todasLasOfertas.filter(o => {
        const nombrePlan = o.plans ? o.plans.name.toLowerCase() : '';
        const nombreServicio = (o.plans && o.plans.services) ? o.plans.services.name.toLowerCase() : '';
        const descripcion = o.description ? o.description.toLowerCase() : '';
        return nombrePlan.includes(busqueda) || nombreServicio.includes(busqueda) || descripcion.includes(busqueda);
      });
      renderizarOfertas(filtradas);
    });

    cargarOfertas();
  </script>
</body>
</html>
