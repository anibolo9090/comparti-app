  <!-- LÓGICA DE CARGA DESDE SUPABASE -->
  <script>
    const supabaseUrl = 'https://xygatgvzdniivzwndaxy.supabase.co';
    const apikey = 'sb_publishable_fDfrz9tONWlI3ETRbanG3w_cXYsFVif';

    async function cargarSuscripciones() {
      const contenedor = document.getElementById('contenedorLista');

      try {
        const res = await fetch(`${supabaseUrl}/rest/v1/suscripciones?select=*`, {
          method: 'GET',
          headers: {
            'apikey': apikey,
            'Authorization': 'Bearer ' + apikey
          }
        });

        if (!res.ok) {
          throw new Error('No se pudo conectar con el servidor');
        }

        const data = await res.json();

        if (!data || data.length === 0) {
          contenedor.innerHTML = '<div class="mensaje-estado">No hay suscripciones publicadas todavía. ¡Sé el primero en compartir una!</div>';
          return;
        }

        contenedor.innerHTML = '';
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card-suscripcion';
          
          // Desactivar botón si no hay cupos
          const sinCupos = item.cupos_disponibles <= 0;

          card.innerHTML = `
            <div class="card-info">
              <h4>${item.servicio}</h4>
              <p>${item.plan || 'Plan general'} • Por ${item.usuario || 'Anfitrión'}</p>
              <button class="btn-comprar" ${sinCupos ? 'disabled style="background:#cbd5e1; cursor:not-allowed;"' : ''} onclick="unirseGrupo(${item.id}, ${item.cupos_disponibles})">
                ${sinCupos ? 'Sin lugares' : 'Unirme'}
              </button>
            </div>
            <div class="card-price">
              <span class="price">$${item.precio} ARS</span>
              <span class="spots">${item.cupos_disponibles} lugares libres</span>
            </div>
          `;
          contenedor.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        contenedor.innerHTML = '<div class="mensaje-estado">Error al cargar las suscripciones.</div>';
      }
    }

    async function unirseGrupo(idSuscripcion, cuposActuales) {
      if (cuposActuales <= 0) {
        alert('Lo siento, este grupo ya no tiene lugares disponibles.');
        return;
      }

      const nuevosCupos = cuposActuales - 1;

      try {
        // Actualizamos los cupos disponibles restando 1 en Supabase
        const res = await fetch(`${supabaseUrl}/rest/v1/suscripciones?id=eq.${idSuscripcion}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'apikey': apikey,
            'Authorization': 'Bearer ' + apikey,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            cupos_disponibles: nuevosCupos
          })
        });

        if (res.ok) {
          alert('¡Te has unido con éxito al grupo! Se ha reservado tu lugar.');
          cargarSuscripciones(); // Recargamos la lista para reflejar el cambio al instante
        } else {
          const errText = await res.text();
          alert('Error al unirse: ' + errText);
        }
      } catch (err) {
        alert('Error de red: ' + err.message);
      }
    }

    function abrirMenu() { document.getElementById('menuOverlay').classList.add('mostrar'); }
    function cerrarMenu() { document.getElementById('menuOverlay').classList.remove('mostrar'); }
    function cerrarMenuFuera(e) { if (e.target.id === 'menuOverlay') cerrarMenu(); }
  </script>
