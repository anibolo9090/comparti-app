<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar Plataformas — Compartí</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --primary: #3b82f6; 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
    
    .navbar { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .navbar-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: #60a5fa; text-decoration: none; }

    .main-container { max-width: 800px; margin: 24px auto; padding: 0 16px; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    h1 { font-size: 1.5rem; margin: 0; background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .btn-back { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; display: none; }
    .btn-back:hover { color: #fff; }

    .search-box { position: relative; margin-bottom: 24px; }
    .search-input { width: 100%; padding: 14px 16px; border: 1px solid var(--card-border); border-radius: 12px; font-size: 1rem; background: var(--card-bg); color: var(--text); outline: none; }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }

    .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .service-card { background: var(--card-bg); border-radius: 14px; padding: 14px; border: 1px solid var(--card-border); text-align: center; cursor: pointer; transition: all 0.2s; }
    .service-card:hover { transform: translateY(-3px); border-color: #60a5fa; }
    .service-card .icon { font-size: 1.6rem; margin-bottom: 6px; }
    .service-card h3 { margin: 0 0 4px; font-size: 0.95rem; }
    .service-card .offers-count { font-size: 0.75rem; color: #60a5fa; font-weight: 600; background: rgba(96, 165, 250, 0.1); padding: 3px 8px; border-radius: 10px; display: inline-block; }

    .offers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; display: none; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--card-border); display: flex; flex-direction: column; justify-content: space-between; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .service-badge { font-weight: 700; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    .price-tag { font-size: 1.7rem; font-weight: 800; color: #fff; margin: 8px 0; }
    .price-tag small { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
    .details-box { background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 10px; font-size: 0.85rem; color: #cbd5e1; margin: 12px 0 16px; line-height: 1.4; border: 1px solid rgba(255,255,255,0.05); }
    .btn-ws { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: #fff; text-decoration: none; font-weight: 700; padding: 12px; border-radius: 10px; }

    /* Bottom Nav Bar Fija */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 600; gap: 2px; }
    .nav-item.active { color: #60a5fa; }
    .nav-item .icon { font-size: 1.2rem; }

    #status { text-align: center; color: var(--text-muted); font-weight: 600; margin-top: 40px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">🤝 Compartí</a>
    </div>
  </nav>

  <div class="main-container">
    <div class="header-bar">
      <h1 id="titleText">Elegí una Plataforma</h1>
      <button id="btnBack" class="btn-back" onclick="volverACatalogo()">← Ver todas las plataformas</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar servicio (Netflix, Spotify, NBA)...">
    </div>

    <div id="status">Cargando catálogo de servicios...</div>

    <div class="services-grid" id="servicesGrid"></div>
    <div class="offers-grid" id="offersGrid"></div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">🏠</span>
      <span>Inicio</span>
    </a>
    <a href="explorar.html" class="nav-item active">
      <span class="icon">🔍</span>
      <span>Explorar</span>
    </a>
    <a href="publicar.html" class="nav-item">
      <span class="icon">➕</span>
      <span>Publicar</span>
    </a>
    <a href="mis-ofertas.html" class="nav-item">
      <span class="icon">📂</span>
      <span>Mis Ofertas</span>
    </a>
  </div>

  <script>
    const SUPABASE_URL = 'https://xygatgvzdniivzwndaxy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5Z2F0Z3Z6ZG5paXZ6d25kYXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDU1MTcsImV4cCI6MjEwMjk4MTUxN30.oSoJcTxCw69F0AXmVVw5LFeF0HjdCSwHd_yOH4HwbS8';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let serviciosConOfertas = [];
    let todasLasOfertas = [];

    async function inicializar() {
      const statusEl = document.getElementById('status');

      const { data: services, error: errServ } = await db.from('services').select('*');
      const { data: offers, error: errOff } = await db.from('offers').select('*, plans(*, services(*))');

      if (errServ || errOff) {
        statusEl.innerText = 'Error al obtener datos.';
        return;
      }

      todasLasOfertas = offers || [];
      
      serviciosConOfertas = services.map(srv => {
        const ofertasDelServicio = todasLasOfertas.filter(o => o.plans && o.plans.service_id === srv.id);
        return {
          ...srv,
          totalOffers: ofertasDelServicio.length
        };
      });

      statusEl.style.display = 'none';
      renderizarCatalogo(serviciosConOfertas);
    }

    function renderizarCatalogo(listaServicios) {
      const grid = document.getElementById('servicesGrid');
      grid.innerHTML = '';

      listaServicios.forEach(srv => {
        const card = document.createElement('div');
        card.className = 'service-card';
        card.onclick = () => verOfertasDePlataforma(srv);

        card.innerHTML = `
          <div class="icon">${srv.icon || '📺'}</div>
          <h3>${srv.name}</h3>
          <div class="offers-count">${srv.totalOffers} ${srv.totalOffers === 1 ? 'oferta' : 'ofertas'}</div>
        `;
        grid.appendChild(card);
      });
    }

    function verOfertasDePlataforma(servicio) {
      document.getElementById('servicesGrid').style.display = 'none';
      document.getElementById('offersGrid').style.display = 'grid';
      document.getElementById('btnBack').style.display = 'block';
      document.getElementById('titleText').innerText = `${servicio.icon} Ofertas de ${servicio.name}`;

      const ofertasFiltradas = todasLasOfertas.filter(o => o.plans && o.plans.service_id === servicio.id);
      renderizarOfertas(ofertasFiltradas);
    }

    function volverACatalogo() {
      document.getElementById('servicesGrid').style.display = 'grid';
      document.getElementById('offersGrid').style.display = 'none';
      document.getElementById('btnBack').style.display = 'none';
      document.getElementById('titleText').innerText = 'Elegí una Plataforma';
      document.getElementById('status').style.display = 'none';
    }

    function renderizarOfertas(lista) {
      const grid = document.getElementById('offersGrid');
      const statusEl = document.getElementById('status');
      grid.innerHTML = '';

      if (lista.length === 0) {
        statusEl.style.display = 'block';
        statusEl.innerText = 'Aún no hay ofertas publicadas para esta plataforma.';
        return;
      } else {
        statusEl.style.display = 'none';
      }

      lista.forEach(offer => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const planName = offer.plans ? offer.plans.name : 'Plataforma';
        const phone = offer.whatsapp_number || '5491112345678';
        const mensajeWS = encodeURIComponent(`¡Hola! Vi tu oferta de ${planName} ($${offer.price_per_slot}/mes) en Compartí y me interesa ocupar un cupo.`);
        const urlWhatsApp = `https://wa.me/${phone}?text=${mensajeWS}`;

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="service-badge">${planName}</div>
            </div>

            <div class="price-tag">
              $${offer.price_per_slot.toLocaleString('es-AR')} <small>/ mes</small>
            </div>

            <div class="details-box">
              📍 Cupos libres: <strong>${offer.available_slots}</strong><br>
              💬 ${offer.description || 'Sin detalles adicionales'}
            </div>
          </div>

          <a href="${urlWhatsApp}" target="_blank" class="btn-ws">
            <span>💬</span> Contactar por WhatsApp
          </a>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const busqueda = e.target.value.toLowerCase().trim();
      
      if (document.getElementById('servicesGrid').style.display !== 'none') {
        const filtrados = serviciosConOfertas.filter(s => s.name.toLowerCase().includes(busqueda));
        renderizarCatalogo(filtrados);
      }
    });

    inicializar();
  </script>
</body>
</html>
