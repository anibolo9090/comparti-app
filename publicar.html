<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compartí — Publicar Oferta</title>
  <style>
    :root { 
      --primary: #3b82f6; 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }
    
    .navbar { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .navbar-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: #60a5fa; text-decoration: none; }

    .main-container { max-width: 600px; margin: 24px auto; padding: 0 16px; }
    
    .form-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; }
    .form-title { font-size: 1.2rem; color: #60a5fa; margin-top: 0; margin-bottom: 16px; }
    
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; background: #0f172a; border: 1px solid var(--card-border); padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 0.9rem; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); }
    
    .btn-submit { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 0.95rem; }

    /* Aviso si no está logueado */
    #authGuard { display: none; text-align: center; padding: 40px 20px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; margin-top: 40px; }
    #authGuard h2 { color: #f87171; margin-bottom: 10px; }
    .btn-login-redirect { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; margin-top: 15px; }

    /* Navegación Inferior */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 600; gap: 2px; }
    .nav-item.active { color: #60a5fa; }
    .nav-item .icon { font-size: 1.2rem; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">🤝 Compartí</a>
    </div>
  </nav>

  <div class="main-container">
    
    <!-- CONTENIDO SI ESTÁ LOGUEADO -->
    <div class="form-card" id="publishFormContainer" style="display: none;">
      <h2 class="form-title">➕ Publicar un nuevo cupo</h2>
      <form onsubmit="publicarOferta(event)">
        <div class="form-group">
          <label class="form-label">Seleccioná la plataforma</label>
          <select class="form-select" id="pubPlataforma" required>
            <option value="Netflix">🎬 Netflix</option>
            <option value="Disney+">🏰 Disney+</option>
            <option value="Spotify">🎧 Spotify</option>
            <option value="ChatGPT">🤖 ChatGPT Plus</option>
            <option value="Max">💜 Max</option>
            <option value="Amazon Prime">📦 Amazon Prime</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Lugares / Cupos disponibles</label>
          <input type="number" class="form-input" id="pubCupos" min="1" max="5" value="3" required>
        </div>
        <div class="form-group">
          <label class="form-label">Precio mensual por persona (ARS)</label>
          <input type="number" class="form-input" id="pubPrecio" placeholder="Ej: 4500" required>
        </div>
        <button type="submit" class="btn-submit">Publicar Oferta</button>
      </form>
    </div>

    <!-- AVISO SI NO ESTÁ LOGUEADO -->
    <div id="authGuard">
      <h2>🔒 Acceso Restringido</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Necesitas iniciar sesión o registrarte para poder publicar ofertas y gestionar tus grupos.</p>
      <a href="index.html" class="btn-login-redirect">Ir al Inicio a Iniciar Sesión</a>
    </div>

  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">🏠</span>
      <span>Inicio</span>
    </a>
    <a href="explorar.html" class="nav-item">
      <span class="icon">🔍</span>
      <span>Explorar</span>
    </a>
    <a href="publicar.html" class="nav-item active">
      <span class="icon">➕</span>
      <span>Publicar</span>
    </a>
    <a href="mis-ofertas.html" class="nav-item">
      <span class="icon">📂</span>
      <span>Mis Ofertas</span>
    </a>
  </div>

  <script>
    // Verificar si el usuario inició sesión
    window.onload = function() {
      const logueado = localStorage.getItem('usuarioLogueado');
      if (logueado === 'true') {
        document.getElementById('publishFormContainer').style.display = 'block';
        document.getElementById('authGuard').style.display = 'none';
      } else {
        document.getElementById('publishFormContainer').style.display = 'none';
        document.getElementById('authGuard').style.display = 'block';
      }
    };

    function publicarOferta(e) {
      e.preventDefault();
      alert('¡Oferta publicada con éxito! Ya aparece en la sección Explorar y Mis Ofertas.');
      window.location.href = 'mis-ofertas.html';
    }
  </script>
</body>
</html>
