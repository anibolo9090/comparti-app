<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Cupo — Compartí</title>

  <style>
    :root { 
      --primary: #3b82f6; 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }
    
    .navbar { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; text-align: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: #60a5fa; text-decoration: none; }

    .main-container { max-width: 600px; margin: 20px auto; padding: 0 16px; }
    
    .form-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .form-title { font-size: 1.2rem; color: #60a5fa; margin-top: 0; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 14px; text-align: left; }
    .form-label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    .form-input, .form-select, .form-textarea { width: 100%; background: #0f172a; border: 1px solid var(--card-border); padding: 10px 12px; border-radius: 10px; color: #fff; font-size: 0.9rem; }
    .form-select { cursor: pointer; }
    .form-textarea { resize: vertical; min-height: 70px; }
    
    .btn-submit { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: #2563eb; }

    /* Navegación inferior */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 600; gap: 2px; }
    .nav-item.active { color: #60a5fa; }
    .nav-item .icon { font-size: 1.2rem; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">🤝 Compartí</a>
  </nav>

  <div class="main-container">
    <div class="form-box">
      <h2 class="form-title">➕ Publicar un nuevo grupo</h2>
      
      <form onsubmit="publicarCupo(event)">
        <div class="form-group">
          <label class="form-label">Seleccioná la plataforma</label>
          <select id="pubServicio" class="form-select" onchange="actualizarDatosPlataforma()" required>
            <option value="netflix">🎬 Netflix (Estándar)</option>
            <option value="disney">🏰 Disney+ (Premium)</option>
            <option value="spotify">🎧 Spotify (Familiar)</option>
            <option value="chatgpt">🤖 ChatGPT Plus</option>
            <option value="max">💜 Max (Platino)</option>
            <option value="prime">📦 Amazon Prime Video</option>
            <option value="youtube">▶️ YouTube Premium</option>
            <option value="crunchyroll">🍥 Crunchyroll</option>
            <option value="paramount">⛰️ Paramount+</option>
            <option value="apple">🍎 Apple TV+</option>
            <option value="canva">🎨 Canva Pro</option>
            <option value="microsoft">🪟 Microsoft 365 (Familiar)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Lugares / Cupos disponibles</label>
          <input type="number" id="pubCupos" class="form-input" min="1" max="6" value="3" required>
        </div>

        <div class="form-group">
          <label class="form-label">Precio mensual por persona (ARS)</label>
          <input type="number" id="pubPrecio" class="form-input" required placeholder="Ej: 4500">
        </div>

        <div class="form-group">
          <label class="form-label">Correo o Usuario de la cuenta a compartir</label>
          <input type="text" id="pubEmailCuenta" class="form-input" required placeholder="correo@ejemplo.com o usuario">
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña de acceso</label>
          <input type="text" id="pubPassCuenta" class="form-input" required placeholder="Contraseña del servicio">
        </div>

        <div class="form-group">
          <label class="form-label">Notas adicionales o reglas del grupo (Opcional)</label>
          <textarea id="pubNotas" class="form-textarea" placeholder="Ej: Perfil 3 libre, pago por MercadoPago antes del 10..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Publicar Oferta</button>
      </form>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Inicio</span></a>
    <a href="explorar.html" class="nav-item"><span class="icon">🔍</span><span>Explorar</span></a>
    <a href="publicar.html" class="nav-item active"><span class="icon">➕</span><span>Publicar</span></a>
    <a href="mis-ofertas.html" class="nav-item"><span class="icon">📂</span><span>Mis Ofertas</span></a>
  </div>

  <script>
    const serviciosData = {
      netflix: { name: 'Netflix (Estándar)', comparti: 4500 },
      disney: { name: 'Disney+ (Premium)', comparti: 4000 },
      spotify: { name: 'Spotify (Familiar)', comparti: 2000 },
      chatgpt: { name: 'ChatGPT Plus', comparti: 8000 },
      max: { name: 'Max (Platino)', comparti: 3500 },
      prime: { name: 'Amazon Prime Video', comparti: 2000 },
      youtube: { name: 'YouTube Premium', comparti: 2500 },
      crunchyroll: { name: 'Crunchyroll', comparti: 1500 },
      paramount: { name: 'Paramount+', comparti: 1800 },
      apple: { name: 'Apple TV+', comparti: 2200 },
      canva: { name: 'Canva Pro', comparti: 1500 },
      microsoft: { name: 'Microsoft 365', comparti: 2000 }
    };

    window.onload = function() {
      actualizarDatosPlataforma();
    };

    function actualizarDatosPlataforma() {
      const select = document.getElementById('pubServicio').value;
      const inputPrecio = document.getElementById('pubPrecio');
      if (serviciosData[select]) {
        inputPrecio.value = serviciosData[select].comparti;
      }
    }

    function publicarCupo(e) {
      e.preventDefault();
      
      const logueado = localStorage.getItem('usuarioLogueado');
      if (logueado !== 'true') {
        alert('Debes iniciar sesión para publicar una oferta.');
        window.location.href = 'index.html';
        return;
      }

      const servicioKey = document.getElementById('pubServicio').value;
      const cupos = document.getElementById('pubCupos').value;
      const precio = document.getElementById('pubPrecio').value;
      const emailCuenta = document.getElementById('pubEmailCuenta').value;
      const passCuenta = document.getElementById('pubPassCuenta').value;
      const notas = document.getElementById('pubNotas').value;

      const nuevaOferta = {
        id: Date.now(),
        servicio: serviciosData[servicioKey].name,
        cupos: cupos,
        precio: precio,
        emailCuenta: emailCuenta,
        passCuenta: passCuenta,
        notas: notas,
        usuarioCreador: localStorage.getItem('usuarioEmail') || 'Anónimo'
      };

      let misOfertas = JSON.parse(localStorage.getItem('misOfertasGuardadas')) || [];
      misOfertas.push(nuevaOferta);
      localStorage.setItem('misOfertasGuardadas', JSON.stringify(misOfertas));

      alert('¡Oferta publicada con éxito!');
      window.location.href = 'mis-ofertas.html';
    }
  </script>
</body>
</html>
