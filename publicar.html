<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Oferta — Compartí</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --primary: #3b82f6; 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }
    
    .navbar { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .navbar-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: #60a5fa; text-decoration: none; }

    .main-container { max-width: 600px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 20px; background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .form-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
    input, select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }

    .btn-submit { width: 100%; background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-submit:hover { background: #1d4ed8; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 600; gap: 2px; }
    .nav-item.active { color: #60a5fa; }
    .nav-item .icon { font-size: 1.2rem; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">🤝 Compartí</a>
    </div>
  </nav>

  <div class="main-container">
    <h1>Publicar una Cuenta</h1>

    <div class="form-card">
      <form id="publishForm" onsubmit="guardarOferta(event)">
        <div class="form-group">
          <label for="serviceSelect">Plataforma:</label>
          <select id="serviceSelect" onchange="cargarPlanes()" required>
            <option value="">Cargando plataformas...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="planSelect">Plan Específico:</label>
          <select id="planSelect" required disabled>
            <option value="">Seleccioná una plataforma primero</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sellerUsername">👤 Tu Nombre de Usuario / Alias:</label>
          <input type="text" id="sellerUsername" placeholder="Ej: luca_streaming" required>
        </div>

        <div class="form-group">
          <label for="whatsappInput">💬 Tu WhatsApp (con código de país sin +):</label>
          <input type="tel" id="whatsappInput" placeholder="Ej: 5491112345678" required>
        </div>

        <div class="form-group">
          <label for="priceInput">💰 Precio por cupo mensual ($ ARS):</label>
          <input type="number" id="priceInput" placeholder="Ej: 3000" min="1" required>
        </div>

        <div class="form-group">
          <label for="slotsInput">📍 Cupos disponibles:</label>
          <input type="number" id="slotsInput" placeholder="Ej: 2" min="1" max="10" required>
        </div>

        <div class="form-group">
          <label for="descInput">📝 Descripción / Aclaraciones:</label>
          <textarea id="descInput" placeholder="Ej: Perfil individual con PIN, pago por transferencia Mercado Pago del 1 al 5 de cada mes."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnPublish">🚀 Publicar Oferta</button>
      </form>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">🏠</span>
      <span>Inicio</span>
    </a>
    <a href="explorar.html" class="nav-item">
      <span class="icon">🔍</span>
      <span>Explorar</span>
    </a>
    <a href="publicar.html" class="nav-item active">
      <span class="icon">➕</span>
      <span>Publicar</span>
    </a>
    <a href="mis-ofertas.html" class="nav-item">
      <span class="icon">📂</span>
      <span>Mis Ofertas</span>
    </a>
  </div>

  <script>
    const SUPABASE_URL = 'https://xygatgvzdniivzwndaxy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5Z2F0Z3Z6ZG5paXZ6d25kYXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDU1MTcsImV4cCI6MjEwMjk4MTUxN30.oSoJcTxCw69F0AXmVVw5LFeF0HjdCSwHd_yOH4HwbS8';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let planesGlobales = [];

    async function cargarServicios() {
      const serviceSelect = document.getElementById('serviceSelect');
      const { data: services, error: errSrv } = await db.from('services').select('*').order('name', { ascending: true });
      const { data: plans, error: errPlans } = await db.from('plans').select('*');

      if (errSrv || errPlans) {
        alert('Error al cargar servicios de la base de datos.');
        return;
      }

      planesGlobales = plans || [];
      serviceSelect.innerHTML = '<option value="">-- Seleccionar Plataforma --</option>';

      services.forEach(srv => {
        serviceSelect.innerHTML += `<option value="${srv.id}">${srv.icon || '📺'} ${srv.name}</option>`;
      });
    }

    function cargarPlanes() {
      const serviceId = document.getElementById('serviceSelect').value;
      const planSelect = document.getElementById('planSelect');

      if (!serviceId) {
        planSelect.innerHTML = '<option value="">Seleccioná una plataforma primero</option>';
        planSelect.disabled = true;
        return;
      }

      const planesFiltrados = planesGlobales.filter(p => p.service_id === serviceId);
      planSelect.innerHTML = '<option value="">-- Seleccionar Plan --</option>';

      planesFiltrados.forEach(p => {
        planSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      });

      planSelect.disabled = false;
    }

    async function guardarOferta(e) {
      e.preventDefault();
      const btn = document.getElementById('btnPublish');
      btn.innerText = 'Guardando...';
      btn.disabled = true;

      const planId = document.getElementById('planSelect').value;
      const username = document.getElementById('sellerUsername').value.trim();
      let whatsapp = document.getElementById('whatsappInput').value.trim().replace(/\D/g, '');
      const precio = document.getElementById('priceInput').value;
      const cupos = document.getElementById('slotsInput').value;
      const descripcion = document.getElementById('descInput').value.trim();

      if (whatsapp.length === 10 && !whatsapp.startsWith('549')) {
        whatsapp = '549' + whatsapp;
      }

      const { data, error } = await db.from('offers').insert([{
        plan_id: planId,
        price_per_slot: parseInt(precio),
        available_slots: parseInt(cupos),
        whatsapp_number: whatsapp,
        seller_username: username,
        description: descripcion,
        seller_sales: 0,
        seller_rating: 5.0,
        is_new_user: true
      }]);

      if (error) {
        alert('Error al publicar: ' + error.message);
        btn.innerText = '🚀 Publicar Oferta';
        btn.disabled = false;
      } else {
        alert('¡Oferta publicada exitosamente!');
        window.location.href = 'explorar.html';
      }
    }

    cargarServicios();
  </script>
</body>
</html>
