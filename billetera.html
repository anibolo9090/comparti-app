<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Billetera - Compartí</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .wallet-card {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      text-align: center;
    }
    .wallet-card h2 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      font-weight: 400;
      opacity: 0.9;
    }
    .balance-amount {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0;
    }
    .btn-recargar {
      background-color: #ffffff;
      color: #4f46e5;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: background 0.2s;
    }
    .btn-recargar:hover {
      background-color: #f8fafc;
    }
    .actions-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .actions-section h3 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #1e293b;
    }
    .quick-amounts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-amount {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-amount:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Tarjeta de Saldo Principal -->
  <div class="wallet-card">
    <h2>Saldo disponible en Billetera</h2>
    <p class="balance-amount" id="lblSaldo">$0</p>
    <button class="btn-recargar" onclick="recargarSaldo(5000)">+ Recargar $5.000</button>
  </div>

  <!-- Sección de Opciones de Recarga Rápida -->
  <div class="actions-section">
    <h3>Carga rápida</h3>
    <p style="font-size: 0.9rem; color: #64748b;">Selecciona un monto para simular una recarga inmediata a tu cuenta:</p>
    <div class="quick-amounts">
      <button class="btn-amount" onclick="recargarSaldo(2000)">+$2.000</button>
      <button class="btn-amount" onclick="recargarSaldo(5000)">+$5.000</button>
      <button class="btn-amount" onclick="recargarSaldo(10000)">+$10.000</button>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://xygatgvzdniivzwndaxy.supabase.co';
    const apikey = 'sb_publishable_fDfrz9tONWlI3ETRbanG3w_cXYsFVif';
    const usuarioActual = 'usuario_1'; // Identificador fijo para pruebas de la app

    async function obtenerSaldo() {
      try {
        let res = await fetch(`${supabaseUrl}/rest/v1/billetera?usuario_id=eq.${usuarioActual}&select=*`, {
          headers: { 'apikey': apikey, 'Authorization': 'Bearer ' + apikey }
        });
        
        let data = [];
        if (res.ok) {
          data = await res.json();
        }

        if (data && data.length > 0) {
          const saldoActual = data[0].saldo || 0;
          document.getElementById('lblSaldo').textContent = `$${saldoActual.toLocaleString('es-AR')}`;
        } else {
          // Si el usuario no tiene registro en la billetera aún, lo creamos con saldo 0
          await crearBilleteraInicial();
        }
      } catch (err) {
        console.error("Error al obtener saldo:", err);
      }
    }

    async function crearBilleteraInicial() {
      await fetch(`${supabaseUrl}/rest/v1/billetera`, {
        method: 'POST',
        headers: {
          'apikey': apikey,
          'Authorization': 'Bearer ' + apikey,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({ usuario_id: usuarioActual, saldo: 0 })
      });
      document.getElementById('lblSaldo').textContent = "$0";
    }

    async function recargarSaldo(montoExtra) {
      try {
        // 1. Primero consultamos el saldo actual
        let res = await fetch(`${supabaseUrl}/rest/v1/billetera?usuario_id=eq.${usuarioActual}&select=*`, {
          headers: { 'apikey': apikey, 'Authorization': 'Bearer ' + apikey }
        });
        let data = await res.json();
        
        let saldoViejo = 0;
        if (data && data.length > 0) {
          saldoViejo = parseFloat(data[0].saldo) || 0;
        }

        let nuevoSaldo = saldoViejo + montoExtra;

        // 2. Actualizamos el saldo en Supabase
        let updateRes = await fetch(`${supabaseUrl}/rest/v1/billetera?usuario_id=eq.${usuarioActual}`, {
          method: 'PATCH',
          headers: {
            'apikey': apikey,
            'Authorization': 'Bearer ' + apikey,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({ saldo: nuevoSaldo, actualizado_at: new Date() })
        });

        if (updateRes.ok) {
          alert(`¡Recarga exitosa! Se sumaron $${montoExtra.toLocaleString('es-AR')} a tu billetera.`);
          obtenerSaldo(); // Refrescar en pantalla
        } else {
          alert("Hubo un error al procesar la recarga.");
        }
      } catch (err) {
        console.error("Error en recarga:", err);
      }
    }

    // Cargar el saldo al abrir la página
    window.onload = obtenerSaldo;
  </script>
</body>
</html>
