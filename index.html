<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compartí — Ahorrá compartiendo tus cuentas</title>

  <style>
    :root { 
      --primary: #3b82f6; 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }
    
    .navbar { background: rgba(30, 41, 59, 0.9); border-bottom: 1px solid var(--card-border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .navbar-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: #60a5fa; text-decoration: none; }
    
    .btn-login-nav { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    .main-container { max-width: 800px; margin: 20px auto; padding: 0 16px; }
    
    .hero { text-align: center; margin-bottom: 20px; }
    .hero h1 { font-size: 1.6rem; color: #60a5fa; }

    /* Calculadora */
    .calc-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin: 16px 0; }
    .calc-title { font-size: 1.05rem; color: #60a5fa; text-align: center; margin-top: 0; }
    .service-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 220px; overflow-y: auto; }
    .service-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid var(--card-border); padding: 10px 12px; border-radius: 10px; cursor: pointer; }
    .service-item.selected { border-color: var(--primary); background: rgba(59, 130, 246, 0.08); }

    /* MENÚ DESPLEGABLE (DRAWER) */
    .menu-overlay { 
      position: fixed; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(15, 23, 42, 0.8); 
      z-index: 99999; 
      display: none; 
      align-items: flex-end; 
    }
    .menu-overlay.mostrar { display: flex; }

    .menu-drawer { 
      background: #1e293b; 
      border-top: 1px solid var(--card-border); 
      border-top-left-radius: 20px; 
      border-top-right-radius: 20px; 
      width: 100%; 
      max-height: 80vh; 
      overflow-y: auto; 
      padding: 20px; 
    }
    
    .menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; margin-bottom: 10px; }
    .menu-close { background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; }

    .menu-item-link { display: block; padding: 12px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: #60a5fa; text-decoration: none; margin-bottom: 8px; font-weight: 600; }

    /* BARRA INFERIOR */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 9999; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; background: none; border: none; }
    .nav-item.active { color: #60a5fa; }
    .nav-item .icon { font-size: 1.3rem; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">🤝 Compartí</a>
      <button class="btn-login-nav" onclick="alert('Sección de acceso')">Ingresar</button>
    </div>
  </nav>

  <div class="main-container">
    <div class="hero">
      <h1>Ahorrá en suscripciones</h1>
    </div>

    <!-- CALCULADORA -->
    <div class="calc-box">
      <h2 class="calc-title">Calculadora de Ahorro</h2>
      <div class="service-list" id="serviceList"></div>
    </div>
  </div>

  <!-- MENÚ DESPLEGABLE INFERIOR -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-drawer">
      <div class="menu-header">
        <h3 style="margin:0; color:#fff;">Menú Principal</h3>
        <button class="menu-close" onclick="cerrarMenu()">&times;</button>
      </div>
      <a href="explorar.html" class="menu-item-link">➕ Comprar una suscripción</a>
      <a href="publicar.html" class="menu-item-link">📤 Compartir una suscripción</a>
      <a href="mis-ofertas.html" class="menu-item-link">💳 Mis Suscripciones</a>
      <div class="menu-item-link" onclick="cerrarMenu()" style="color:#f87171; cursor:pointer;">Cerrar menú</div>
    </div>
  </div>

  <!-- BARRA DE NAVEGACIÓN INFERIOR -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item active"><span class="icon">🏠</span><span>Inicio</span></a>
    <a href="explorar.html" class="nav-item"><span class="icon">💳</span><span>Explorar</span></a>
    <a href="mis-ofertas.html" class="nav-item"><span class="icon">👤</span><span>Mi Perfil</span></a>
    <button class="nav-item" onclick="abrirMenu()"><span class="icon">☰</span><span>Menú</span></button>
  </div>

  <script>
    const serviciosData = [
      { id: 'netflix', name: '🎬 Netflix', full: 21000, comparti: 4500 },
      { id: 'disney', name: '🏰 Disney+', full: 18400, comparti: 4000 },
      { id: 'spotify', name: '🎧 Spotify', full: 7500, comparti: 2000 }
    ];

    window.onload = function() {
      const contenedor = document.getElementById('serviceList');
      serviciosData.forEach(s => {
        const item = document.createElement('div');
        item.className = 'service-item';
        item.innerHTML = `<span>${s.name}</span> <b>$${s.comparti}</b>`;
        contenedor.appendChild(item);
      });
    };

    function abrirMenu() {
      const el = document.getElementById('menuOverlay');
      el.classList.add('mostrar');
    }

    function cerrarMenu() {
      const el = document.getElementById('menuOverlay');
      el.classList.remove('mostrar');
    }
  </script>
</body>
</html>
