<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compartí — Compartí gastos. Pagá menos.</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      max-width: 500px;
      background: #ffffff;
      padding: 40px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 { font-size: 2.5rem; margin-bottom: 8px; color: #1e40af; }
    p.tagline { font-size: 1.25rem; font-weight: 600; color: #334155; margin-bottom: 12px; }
    p.desc { color: #64748b; font-size: 0.95rem; margin-bottom: 28px; }
    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-primary { background-color: #2563eb; color: #ffffff; }
    .btn-secondary { border: 1px solid #cbd5e1; color: #0f172a; background-color: #ffffff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Compartí</h1>
    <p class="tagline">Compartí gastos. Pagá menos.</p>
    <p class="desc">Encontrá suscripciones y gastos compartibles de forma transparente.</p>
    <div class="btn-group">
      <a href="explorar.html" class="btn btn-primary">Explorar ofertas</a>
      <a href="#" class="btn btn-secondary">Publicar una oferta</a>
    </div>
  </div>
</body>
</html>
